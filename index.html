<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaz Taxi</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f6f9; color: #222; padding: 14px; }
        .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .title { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: #111; }
        .btn-gps {
            width: 100%; padding: 12px; background: #eef5fc; color: #2481cc;
            border: 1.5px solid #2481cc; border-radius: 12px; font-size: 14px; font-weight: 700;
            margin-bottom: 10px; cursor: pointer;
        }
        select, input {
            width: 100%; padding: 11px 12px; border: 1.5px solid #dcdcdc;
            border-radius: 10px; font-size: 14px; background: #fff; outline: none; margin-bottom: 8px;
        }
        select:focus, input:focus { border-color: #2481cc; }
        .gps-status { font-size: 12px; color: #157347; font-weight: 600; margin-bottom: 6px; display: none; }
        .result-box {
            display: none; background: #f3faf6; border: 1.5px solid #bce3cb;
            border-radius: 14px; padding: 14px; margin-bottom: 12px;
        }
        .price-big { font-size: 22px; font-weight: 800; color: #157347; margin-top: 4px; }
        .btn-main {
            width: 100%; padding: 14px; background: #2481cc; color: #fff;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .btn-order { background: #157347; display: none; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">📍 Откуда вас забрать?</div>
    <button type="button" class="btn-gps" id="btnGps">📡 Определить моё местоположение по GPS</button>
    <div class="gps-status" id="gpsStatus">✅ Координаты GPS определены!</div>
    <select id="fromSelect">
        <option value="gps" id="optGps" disabled>📡 По моему местоположению GPS</option>
        <option value="51.7895,28.3310">Лельчицы, ул. Советская (район д. 97)</option>
        <option value="51.7873,28.3275">Лельчицы, Центр / Автостанция</option>
        <option value="51.7840,28.3220">Лельчицы, Районная больница (ЦРБ)</option>
        <option value="51.7910,28.3240">Лельчицы, Евроопт / Рынок</option>
        <option value="51.7161,28.4319">аг. Липляны (Клуб / Центр)</option>
    </select>
    <input type="text" id="fromDetails" placeholder="Уточните адрес (напр. д. 97, кв. 27, 2 подъезд)...">
</div>

<div class="card">
    <div class="title">🏁 Куда поедем?</div>
    <select id="toSelect">
        <option value="51.7161,28.4319">аг. Липляны (Клуб / Центр)</option>
        <option value="51.7873,28.3275">Лельчицы, Центр / Автостанция</option>
        <option value="51.7895,28.3310">Лельчицы, ул. Советская (район д. 97)</option>
        <option value="51.7840,28.3220">Лельчицы, Районная больница (ЦРБ)</option>
        <option value="51.7910,28.3240">Лельчицы, Евроопт / Рынок</option>
        <option value="51.8322,28.2511">аг. Буйновичи</option>
        <option value="custom">✍️ Вписать свой адрес вручную</option>
    </select>
    <input type="text" id="toDetails" placeholder="Введите точный адрес назначения (улица, дом)...">
</div>

<div class="result-box" id="resultBox">
    <div id="routeText" style="font-size: 13px; color: #333;"></div>
    <div id="distText" style="font-size: 13px; color: #555; margin-top: 4px;"></div>
    <div class="price-big" id="priceText">0 BYN</div>
</div>

<button type="button" class="btn-main" id="btnCalc">🧮 Рассчитать стоимость поездки</button>
<button type="button" class="btn-main btn-order" id="btnOrder">🚀 Заказать такси</button>

<script>
    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); }

    var BASE_PRICE = 3.0;
    var PRICE_PER_KM = 0.8;
    var gpsLat = null;
    var gpsLon = null;
    var readyOrder = null;

    var btnGps = document.getElementById('btnGps');
    var gpsStatus = document.getElementById('gpsStatus');
    var fromSelect = document.getElementById('fromSelect');
    var optGps = document.getElementById('optGps');
    var fromDetails = document.getElementById('fromDetails');
    var toSelect = document.getElementById('toSelect');
    var toDetails = document.getElementById('toDetails');
    var btnCalc = document.getElementById('btnCalc');
    var btnOrder = document.getElementById('btnOrder');
    var resultBox = document.getElementById('resultBox');

    btnGps.onclick = function() {
        if (!navigator.geolocation) {
            alert('GPS недоступен. Выберите улицу из списка!');
            return;
        }
        btnGps.textContent = '⏳ Определяем спутники GPS...';
        navigator.geolocation.getCurrentPosition(function(pos) {
            gpsLat = pos.coords.latitude;
            gpsLon = pos.coords.longitude;
            optGps.disabled = false;
            optGps.textContent = '📡 Моё GPS (' + gpsLat.toFixed(4) + ', ' + gpsLon.toFixed(4) + ')';
            fromSelect.value = 'gps';
            gpsStatus.style.display = 'block';
            btnGps.textContent = '📡 Обновить местоположение GPS';
        }, function() {
            btnGps.textContent = '📡 Определить моё местоположение по GPS';
            alert('Не удалось поймать GPS (в помещении или на ПК). Выберите адрес из списка!');
        }, { timeout: 8000 });
    };

    function calcAirKm(lat1, lon1, lat2, lon2) {
        var R = 6371;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.25;
    }

    function showPrice(fromName, toName, km) {
        var price = Math.round((BASE_PRICE + km * PRICE_PER_KM) * 2) / 2;
        document.getElementById('routeText').textContent = fromName + ' ➔ ' + toName;
        document.getElementById('distText').textContent = 'Расстояние по дороге: ~' + km + ' км';
        document.getElementById('priceText').textContent = price + ' BYN';
        resultBox.style.display = 'block';

        readyOrder = { from_name: fromName, to_name: toName, km: km, price: price };
        btnCalc.textContent = '🔄 Пересчитать стоимость';
        btnOrder.style.display = 'block';
        btnOrder.textContent = '🚀 Заказать такси за ' + price + ' BYN';
    }

    btnCalc.onclick = function() {
        var lat1, lon1, fromName;
        if (fromSelect.value === 'gps' && gpsLat !== null) {
            lat1 = gpsLat;
            lon1 = gpsLon;
            fromName = 'По GPS (' + gpsLat.toFixed(4) + ', ' + gpsLon.toFixed(4) + ')';
        } else {
            var p1 = fromSelect.value.split(',');
            lat1 = parseFloat(p1.shift());
            lon1 = parseFloat(p1.shift());
            fromName = fromSelect.options.item(fromSelect.selectedIndex).text;
        }
        if (fromDetails.value.trim()) {
            fromName += ' (' + fromDetails.value.trim() + ')';
        }

        var lat2, lon2, toName;
        if (toSelect.value === 'custom') {
            lat2 = 51.7873;
            lon2 = 28.3275;
            toName = toDetails.value.trim() || 'По району';
        } else {
            var p2 = toSelect.value.split(',');
            lat2 = parseFloat(p2.shift());
            lon2 = parseFloat(p2.shift());
            toName = toSelect.options.item(toSelect.selectedIndex).text;
            if (toDetails.value.trim()) {
                toName += ' (' + toDetails.value.trim() + ')';
            }
        }

        btnCalc.disabled = true;
        btnCalc.textContent = '⏳ Считаем маршрут...';

        var url = 'https://project-osrm.org' + lon1 + ',' + lat1 + ';' + lon2 + ',' + lat2 + '?overview=false';
        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                btnCalc.disabled = false;
                var route = (data.routes && data.routes.length > 0) ? data.routes.shift() : null;
                if (data.code === 'Ok' && route) {
                    showPrice(fromName, toName, Math.round((route.distance / 1000) * 10) / 10);
                } else {
                    showPrice(fromName, toName, Math.max(1.0, Math.round(calcAirKm(lat1, lon1, lat2, lon2) * 10) / 10));
                }
            })
            .catch(function() {
                btnCalc.disabled = false;
                showPrice(fromName, toName, Math.max(1.0, Math.round(calcAirKm(lat1, lon1, lat2, lon2) * 10) / 10));
            });
    };

    btnOrder.onclick = function() {
        if (!readyOrder) return;
        if (tg) {
            tg.sendData(JSON.stringify(readyOrder));
        } else {
            alert('Заказ отправлен: ' + readyOrder.price + ' BYN');
        }
    };
</script>
</body>
</html>
