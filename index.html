<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaz Taxi</title>
    <script src="https://telegram.org"></script>
    <script src="https://yandex.ru"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #f4f6f9; overflow: hidden; }
        .map-box { position: relative; flex: 1; width: 100%; }
        #ymap { width: 100%; height: 100%; }
        .center-pin {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%);
            font-size: 38px; z-index: 500; pointer-events: none;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
        }
        .btn-gps {
            position: absolute; right: 12px; bottom: 14px; z-index: 550;
            background: #fff; color: #2481cc; border: none; border-radius: 50px;
            padding: 10px 14px; font-size: 13px; font-weight: 700;
            box-shadow: 0 3px 10px rgba(0,0,0,0.22); cursor: pointer;
        }
        .panel {
            background: #fff; padding: 12px 14px 16px; border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.12); z-index: 600;
        }
        .badge {
            display: inline-block; background: #eef5fc; color: #2481cc;
            font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; margin-bottom: 6px;
        }
        .hint { font-size: 12px; color: #666; margin-bottom: 8px; }
        .row { display: flex; gap: 6px; margin-bottom: 8px; }
        input {
            flex: 1; padding: 10px 12px; border: 1.5px solid #dcdcdc;
            border-radius: 10px; font-size: 14px; outline: none;
        }
        input:focus { border-color: #2481cc; }
        .btn-find {
            background: #f0f2f5; border: none; padding: 0 14px; border-radius: 10px;
            font-size: 14px; font-weight: 600; color: #333; cursor: pointer;
        }
        .summary {
            display: none; background: #f3faf6; border: 1.5px solid #bce3cb;
            padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 13px;
        }
        .summary-row { display: flex; justify-content: space-between; margin-top: 4px; font-size: 16px; }
        .btn-main {
            width: 100%; padding: 13px; background: #2481cc; color: #fff;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .btn-reset {
            width: 100%; padding: 8px; background: transparent; color: #777;
            border: none; font-size: 13px; margin-top: 4px; display: none; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="map-box">
    <div id="ymap"></div>
    <div class="center-pin" id="centerPin">📍</div>
    <button type="button" class="btn-gps" id="btnGps">📡 Моё GPS</button>
</div>

<div class="panel">
    <div class="badge" id="stepBadge">Шаг 1 из 2: Точка подачи (Откуда)</div>
    <div class="hint" id="hintText">💡 Сдвиньте карту под прицел 📍, нажмите GPS или введите адрес ниже</div>

    <div class="row" id="searchRow">
        <input type="text" id="addrInput" placeholder="Напр.: Советская 97 или г. Мозырь ТЦ Бобровский...">
        <button type="button" class="btn-find" id="btnFind">Найти</button>
    </div>

    <div class="summary" id="summaryBox">
        <div id="routeDesc" style="color: #333; margin-bottom: 4px;"></div>
        <div class="summary-row">
            <span id="distLabel">0 км</span>
            <strong id="priceLabel" style="color: #157347;">0 BYN</strong>
        </div>
    </div>

    <button type="button" class="btn-main" id="btnAction">✅ Подтвердить точку подачи (Откуда)</button>
    <button type="button" class="btn-reset" id="btnReset">🔄 Выбрать маршрут заново</button>
</div>

<script>
    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) { tg.expand(); }

    var BASE_PRICE = 3.0;
    var PRICE_PER_KM = 0.8;
    var map = null;
    var step = 1, pointFrom = null, pointTo = null, orderPayload = null;

    var stepBadge = document.getElementById('stepBadge');
    var hintText = document.getElementById('hintText');
    var addrInput = document.getElementById('addrInput');
    var btnFind = document.getElementById('btnFind');
    var btnGps = document.getElementById('btnGps');
    var btnAction = document.getElementById('btnAction');
    var btnReset = document.getElementById('btnReset');
    var centerPin = document.getElementById('centerPin');
    var summaryBox = document.getElementById('summaryBox');
    var searchRow = document.getElementById('searchRow');

    if (window.ymaps) {
        ymaps.ready(function() {
            map = new ymaps.Map('ymap', {
                center: [51.7873, 28.3275],
                zoom: 16,
                controls: ['zoomControl']
            });

            var params = new URLSearchParams(window.location.search);
            if (params.get('track') === '1') {
                var pLat = parseFloat(params.get('plat') || '51.7895');
                var pLon = parseFloat(params.get('plon') || '28.3310');
                var dLat = parseFloat(params.get('dlat') || '51.7840');
                var dLon = parseFloat(params.get('dlon') || '28.3220');
                startLiveCarView([dLat, dLon], [pLat, pLon]);
            }
        });
    } else {
        hintText.textContent = '⚠️ Карта Яндекса не загрузилась — проверьте настройку ключа в кабинете Яндекса';
    }

    function startLiveCarView(carCoords, passCoords) {
        centerPin.style.display = 'none';
        searchRow.style.display = 'none';
        btnGps.style.display = 'none';
        btnAction.style.display = 'none';
        stepBadge.textContent = '🚕 Водитель уже в пути к вам!';
        hintText.textContent = '💡 Оплата напрямую водителю в конце поездки.';

        var passMark = new ymaps.Placemark(passCoords, { iconCaption: 'Вы здесь 📍' }, { preset: 'islands#blueCircleDotIconWithCaption' });
        var carMark = new ymaps.Placemark(carCoords, { iconCaption: 'Такси едет к вам 🚕' }, { preset: 'islands#greenAutoIcon' });
        map.geoObjects.add(passMark);
        map.geoObjects.add(carMark);

        ymaps.route([carCoords, passCoords]).then(function(route) {
            route.getPaths().options.set({ strokeColor: '#157347', strokeWidth: 5, opacity: 0.85 });
            map.geoObjects.add(route);
            map.setBounds(route.getBounds(), { checkZoomRange: true, zoomMargin: 40 });
        });
    }

    btnGps.onclick = function() {
        if (!navigator.geolocation) return alert('GPS недоступен');
        btnGps.textContent = '⏳ Поиск GPS...';
        navigator.geolocation.getCurrentPosition(function(pos) {
            var coords = [pos.coords.latitude, pos.coords.longitude];
            if (map) map.setCenter(coords, 17);
            ymaps.geocode(coords).then(function(res) {
                var first = res.geoObjects.get(0);
                if (first) addrInput.value = first.getAddressLine().replace(/^Беларусь,\s*Гомельская область,\s*/i, '');
            });
            btnGps.textContent = '📡 Моё GPS';
        }, function() {
            btnGps.textContent = '📡 Моё GPS';
            alert('Не удалось поймать GPS — сдвиньте карту пальцем!');
        }, { timeout: 8000 });
    };

    btnFind.onclick = function() {
        var raw = addrInput.value.trim();
        if (!raw || !map) return;
        btnFind.textContent = '...';
        var lower = raw.toLowerCase();
        var hasCity = (lower.indexOf('мозыр') !== -1 || lower.indexOf('гомел') !== -1 || lower.indexOf('минск') !== -1 || lower.indexOf('лельчиц') !== -1 || lower.indexOf('липлян') !== -1 || lower.indexOf('буйнович') !== -1);
        var q = hasCity ? ('Беларусь, ' + raw) : ('Беларусь, Лельчицы, ' + raw);

        ymaps.geocode(q, { results: 1 }).then(function(res) {
            var first = res.geoObjects.get(0);
            if (first) {
                map.setCenter(first.geometry.getCoordinates(), 17);
            } else {
                alert('Адрес не найден — подведите прицел 📍 пальцем!');
            }
            btnFind.textContent = 'Найти';
        }, function() { btnFind.textContent = 'Найти'; });
    };

    btnAction.onclick = function() {
        if (!map) return alert('Подождите загрузки карты или обновите страницу!');
        var c = map.getCenter();
        var lat = c.slice(0, 1).pop();
        var lon = c.slice(1, 2).pop();

        if (step === 1) {
            var label = addrInput.value.trim() || ('Точка А (' + lat.toFixed(4) + ', ' + lon.toFixed(4) + ')');
            pointFrom = { coords: [lat, lon], lat: lat, lon: lon, name: label };
            step = 2;
            centerPin.textContent = '🏁';
            stepBadge.textContent = 'Шаг 2 из 2: Куда поедем?';
            hintText.textContent = '💡 Введите адрес (напр. г. Мозырь ТЦ Бобровский) или сдвиньте карту';
            addrInput.value = '';
            addrInput.placeholder = 'Куда поедем? (улица, дом или город)...';
            btnAction.textContent = '🏁 Подтвердить пункт назначения (Куда)';
            btnReset.style.display = 'block';
        } else if (step === 2) {
            var label = addrInput.value.trim() || ('Точка Б (' + lat.toFixed(4) + ', ' + lon.toFixed(4) + ')');
            pointTo = { coords: [lat, lon], lat: lat, lon: lon, name: label };
            btnAction.disabled = true;
            btnAction.textContent = '⏳ Строим маршрут по дорогам...';

            ymaps.route([pointFrom.coords, pointTo.coords]).then(function(route) {
