<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaz Taxi</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #e5e5e5; overflow: hidden; }
        .map-wrapper { position: relative; flex: 1; width: 100%; }
        #map { width: 100%; height: 100%; z-index: 1; }
        .center-pin {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%);
            font-size: 36px; z-index: 500; pointer-events: none;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4));
        }
        .panel {
            background: #fff; padding: 14px 16px 18px; border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.12); z-index: 600;
        }
        .step-badge {
            display: inline-block; background: #eef5fc; color: #2481cc;
            font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; margin-bottom: 8px;
        }
        .input-row { display: flex; gap: 6px; margin-bottom: 10px; }
        input {
            flex: 1; padding: 11px 12px; border: 1.5px solid #dcdcdc;
            border-radius: 10px; font-size: 14px; outline: none;
        }
        input:focus { border-color: #2481cc; }
        .btn-search {
            background: #f0f2f5; border: none; padding: 0 14px; border-radius: 10px;
            font-size: 14px; font-weight: 600; color: #333; cursor: pointer;
        }
        .summary {
            display: none; background: #f3faf6; border: 1px solid #bce3cb;
            padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; font-size: 13px;
        }
        .summary-row { display: flex; justify-content: space-between; margin-top: 4px; font-size: 15px; }
        .btn-main {
            width: 100%; padding: 14px; background: #2481cc; color: #fff;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .btn-reset {
            width: 100%; padding: 10px; background: transparent; color: #777;
            border: none; font-size: 13px; margin-top: 4px; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

<div class="map-wrapper">
    <div id="map"></div>
    <div class="center-pin" id="centerPin">📍</div>
</div>

<div class="panel">
    <div class="step-badge" id="stepBadge">Шаг 1 из 2: Укажите точку подачи (Откуда)</div>

    <div class="input-row" id="searchRow">
        <input type="text" id="addrInput" placeholder="Наведите прицел на дом или введите адрес...">
        <button class="btn-search" id="btnFind">Найти</button>
    </div>

    <div class="summary" id="summaryBox">
        <div id="routeDesc" style="color: #444; margin-bottom: 4px;"></div>
        <div class="summary-row">
            <span id="distLabel">0 км</span>
            <strong id="priceLabel" style="color: #157347;">0 BYN</strong>
        </div>
    </div>

    <button class="btn-main" id="btnAction">✅ Подтвердить точку подачи (Откуда)</button>
    <button class="btn-reset" id="btnReset">🔄 Выбрать точки заново</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Настройки (Лельчицы; для Кордовы заменим на -31.4201, -64.1888)
    const START_LAT = 51.7873;
    const START_LON = 28.3275;
    const BASE_PRICE = 3.0;
    const PRICE_PER_KM = 0.8;

    const map = L.map('map', { zoomControl: false }).setView(new Array(START_LAT, START_LON), 15);
    
    // Быстрый глобальный слой карт CartoDB (грузится мгновенно без блокировок)
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap, © CARTO',
        maxZoom: 19
    }).addTo(map);

    let step = 1;
    let pointFrom = null;
    let pointTo = null;
    let markerFrom = null;
    let markerTo = null;
    let routeLine = null;
    let orderPayload = null;

    const stepBadge = document.getElementById('stepBadge');
    const addrInput = document.getElementById('addrInput');
    const btnFind = document.getElementById('btnFind');
    const btnAction = document.getElementById('btnAction');
    const btnReset = document.getElementById('btnReset');
    const centerPin = document.getElementById('centerPin');
    const summaryBox = document.getElementById('summaryBox');
    const searchRow = document.getElementById('searchRow');

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            map.setView(new Array(pos.coords.latitude, pos.coords.longitude), 16);
        });
    }

    btnFind.onclick = async () => {
        const raw = addrInput.value.trim();
        if (!raw) return;
        btnFind.textContent = '...';
        const q = raw.toLowerCase().includes('лельчиц') || raw.toLowerCase().includes('липлян') ? raw : `Лельчицы, ${raw}`;
        try {
            const res = await fetch(`https://openstreetmap.org{encodeURIComponent(q)}&format=json&limit=1`);
            const data = await res.json();
            const item = data && data.at(0);
            if (item) {
                map.setView(new Array(parseFloat(item.lat), parseFloat(item.lon)), 16);
            } else {
                tg.showAlert('Адрес не найден. Просто передвиньте карту пальцем под прицел 📍!');
            }
        } catch (e) {
            tg.showAlert('Ошибка поиска. Передвиньте карту пальцем под прицел 📍!');
        }
        btnFind.textContent = 'Найти';
    };

    btnAction.onclick = async () => {
        const center = map.getCenter();

        if (step === 1) {
            const label = addrInput.value.trim() || `Точка А (${center.lat.toFixed(4)}, ${center.lng.toFixed(4)})`;
            pointFrom = { lat: center.lat, lon: center.lng, name: label };
            markerFrom = L.marker(new Array(center.lat, center.lng)).addTo(map).bindPopup('Откуда').openPopup();

            step = 2;
            centerPin.textContent = '🏁';
            stepBadge.textContent = 'Шаг 2 из 2: Куда поедем?';
            addrInput.value = '';
            addrInput.placeholder = 'Сдвиньте карту на точку Б или введите адрес...';
            btnAction.textContent = '🏁 Подтвердить пункт назначения (Куда)';
            btnReset.style.display = 'block';
        } 
        else if (step === 2) {
            const label = addrInput.value.trim() || `Точка Б (${center.lat.toFixed(4)}, ${center.lng.toFixed(4)})`;
            pointTo = { lat: center.lat, lon: center.lng, name: label };
            markerTo = L.marker(new Array(center.lat, center.lng)).addTo(map).bindPopup('Куда').openPopup();

            btnAction.disabled = true;
            btnAction.textContent = '⏳ Строим маршрут по дорогам...';

            try {
                const url = `https://project-osrm.org{pointFrom.lon},${pointFrom.lat};${pointTo.lon},${pointTo.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                const route = data.routes && data.routes.at(0);

                if (data.code === 'Ok' && route) {
                    const km = Math.round((route.distance / 1000) * 10) / 10;
                    const rawPrice = BASE_PRICE + (km * PRICE_PER_KM);
                    const price = Math.round(rawPrice * 2) / 2;

                    routeLine = L.geoJSON(route.geometry, { style: { color: '#2481cc', weight: 5 } }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: new Array(35, 35) });

                    step = 3;
                    centerPin.style.display = 'none';
                    searchRow.style.display = 'none';
                    stepBadge.textContent = 'Маршрут готов!';
                    document.getElementById('routeDesc').textContent = `${pointFrom.name} ➔ ${pointTo.name}`;
                    document.getElementById('distLabel').textContent = `Путь: ${km} км`;
                    document.getElementById('priceLabel').textContent = `${price} BYN`;
                    summaryBox.style.display = 'block';

                    orderPayload = { from_name: pointFrom.name, to_name: pointTo.name, km: km, price: price };
                    btnAction.disabled = false;
                    btnAction.style.background = '#157347';
                    btnAction.textContent = `🚀 Заказать такси за ${price} BYN`;
                } else {
                    throw new Error();
                }
            } catch (e) {
                btnAction.disabled = false;
                btnAction.textContent = '⚠️ Не удалось построить путь. Нажмите сброс.';
            }
        } 
        else if (step === 3 && orderPayload) {
            tg.sendData(JSON.stringify(orderPayload));
        }
    };

    btnReset.onclick = () => {
        if (markerFrom) map.removeLayer(markerFrom);
        if (markerTo) map.removeLayer(markerTo);
        if (routeLine) map.removeLayer(routeLine);
        pointFrom = null; pointTo = null; orderPayload = null;
        step = 1;
        centerPin.textContent = '📍';
        centerPin.style.display = 'block';
        searchRow.style.display = 'flex';
        summaryBox.style.display = 'none';
        btnReset.style.display = 'none';
        stepBadge.textContent = 'Шаг 1 из 2: Укажите точку подачи (Откуда)';
        addrInput.value = '';
        addrInput.placeholder = 'Наведите прицел на дом или введите адрес...';
        btnAction.style.background = '#2481cc';
